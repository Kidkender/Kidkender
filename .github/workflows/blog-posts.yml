name: latest blog posts

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: fetch latest dev.to posts
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: 'https://dev.to/feed/kidkender'
          max_post_count: 5
          comment_tag_name: 'BLOG-POST-LIST'
